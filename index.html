<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123c46" />
    <title>Patty Wagon • Free Roam</title>
  </head>
  <body>
    <canvas id="game" aria-label="3D driving world"></canvas>
    <header>
      <div class="brand">
        PATTY <b>WAGON</b><small id="district">Coral Commons</small>
      </div>
      <div class="score">
        <span class="coin">✦</span> <span id="score">0</span
        ><small>/ 96 discoveries</small>
      </div>
    </header>
    <aside>
      <button id="sound" aria-label="Toggle sound">Sound off</button
      ><button id="pause">Pause</button><button id="reset">Reset car</button>
    </aside>
    <div id="toast" role="status"></div>
    <footer>
      <div id="speed">0 <small>km/h</small></div>
      <div class="boost">
        <span id="upgrade">Boost</span
        ><meter
          id="boost"
          min="0"
          max="100"
          value="100"
          aria-label="Boost energy"
        ></meter>
      </div>
      <button id="help">Controls</button>
    </footer>
    <dialog id="menu">
      <h1>Take the scenic route.</h1>
      <p>
        WASD / arrows · drive<br />Space · drift & brake<br />Shift · boost<br />R
        · reset car<br />Escape · pause
      </p>
      <p id="progress"></p>
      <button id="resume">Keep exploring</button>
    </dialog>
    <nav id="touch" aria-label="Driving controls">
      <div>
        <button data-key="ArrowLeft" aria-label="Steer left">◀</button
        ><button data-key="ArrowRight" aria-label="Steer right">▶</button>
      </div>
      <div>
        <button data-key="Space">Drift</button
        ><button data-key="ShiftLeft">Boost</button
        ><button data-key="ArrowDown" aria-label="Reverse">▼</button
        ><button data-key="ArrowUp" aria-label="Accelerate">▲</button>
      </div>
    </nav>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
